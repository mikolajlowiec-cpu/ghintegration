AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Authenticated serverless notes API for threat-modeling practice.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 5
    MemorySize: 128

Resources:
  NotesApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              Audience:
                - !Ref UserPoolClient
        DefaultAuthorizer: CognitoAuthorizer

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-api-client"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: noteId
          AttributeType: S
      KeySchema:
        - AttributeName: ownerId
          KeyType: HASH
        - AttributeName: noteId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  NotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Environment:
        Variables:
          NOTES_TABLE: !Ref NotesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
      Events:
        ListNotes:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /notes
            Method: GET
        CreateNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /notes
            Method: POST
        GetNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /notes/{noteId}
            Method: GET
        DeleteNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref NotesApi
            Path: /notes/{noteId}
            Method: DELETE

Outputs:
  ApiUrl:
    Description: Base URL for the authenticated notes API.
    Value: !Sub "https://${NotesApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  UserPoolId:
    Description: Cognito user pool for API authentication.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client ID.
    Value: !Ref UserPoolClient
